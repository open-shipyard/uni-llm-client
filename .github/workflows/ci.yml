name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each package runs its checks, HTTP tests and Sonar scan only when it changes.
# A change to the shared tests runs the HTTP tests of every package. A change to
# this workflow runs everything.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.ci == 'true' }}
      python-http: ${{ steps.filter.outputs.python == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      typescript: ${{ steps.filter.outputs.typescript == 'true' || steps.filter.outputs.ci == 'true' }}
      swift: ${{ steps.filter.outputs.swift == 'true' || steps.filter.outputs.ci == 'true' }}
      shared: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.ci == 'true' }}
      root: ${{ steps.filter.outputs.root == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/ci.yml
            shared:
              - tests/**
            python:
              - packages/python/**
            typescript:
              - packages/typescript/**
            swift:
              - packages/swift/**
            root:
              - .github/**
              - tests/**
              - sonar-project.properties

  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check
      - run: uv run --locked --no-build ruff format --check
      - run: uv run --locked --no-build mypy
      # The package ships copies of the root license files.
      - run: for f in LICENSE NOTICE AUTHORS; do cmp "$f" "../../$f"; done

  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest

  python-build:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build

  # The language-agnostic tests against the Python test servers. Their coverage
  # is the only coverage reported for the package.
  python-http:
    needs: changes
    if: needs.changes.outputs.python-http == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build pytest --package python
      - working-directory: packages/python
        run: |
          uv run --locked --no-build coverage combine
          uv run --locked --no-build coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: packages/python/coverage.xml

  shared-lint:
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --no-build
      - run: uv run --locked --no-build ruff check
      - run: uv run --locked --no-build ruff format --check
      - run: uv run --locked --no-build mypy

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  # The Swift port uses the toolchain the runner images ship.
  swift-lint:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift format lint --recursive --strict Package.swift Sources Tests

  swift-test:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux keeps the port portable; Apple platforms are where most Swift
        # ships.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/swift
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test

  # One Sonar project per package, plus one for the workflows and shared tests.
  # Pull requests from forks get no secrets, so they skip the scans.
  sonar-python:
    needs: [changes, python-http]
    if: >-
      needs.changes.outputs.python == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads the history to find new code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: python-coverage
          path: packages/python
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: packages/python
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-typescript:
    needs: changes
    if: >-
      needs.changes.outputs.typescript == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: packages/typescript
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-root:
    needs: changes
    if: >-
      needs.changes.outputs.root == 'true' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The one check to require: it passes when every job passed or was skipped.
  ci-ok:
    if: always()
    needs:
      - changes
      - python-lint
      - python-test
      - python-build
      - python-http
      - shared-lint
      - typescript
      - swift-lint
      - swift-test
      - sonar-python
      - sonar-typescript
      - sonar-root
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # The review jobs run Claude on text written by the pull request's author.
  # Claude Code holds the OAuth token in its environment, so each job narrows
  # what Claude can reach and what it can write:
  # - Claude gets no shell. The diff is saved to a file first, and the summary
  #   comes back as structured output for a later step to post.
  # - The commands Claude Code runs get a scrubbed environment.
  # - Claude cannot read /proc, the git config, which holds the action's token,
  #   or the runner's temporary files.
  # - The repository's own agent instructions are removed before Claude starts.
  # - The action logs no tool output, even in a re-run with debug logging.
  security-screening:
    name: Claude security screening
    # The tests first, so that the review spends nothing on broken code.
    needs: ci-ok
    # Ready pull requests from this repository only: forks get no secrets.
    # Every review job names its own condition: a job skipped upstream, such as a
    # package's that did not change, would otherwise skip all those after it.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success' &&
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      touches_security: ${{ fromJSON(steps.screen.outputs.structured_output).touches_security }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF: /tmp/pr-review/pr.diff
        run: |
          mkdir -p "$(dirname "$DIFF")"
          gh pr diff "$PR_NUMBER" -R "$REPO" > "$DIFF"
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER $DIFF' < .github/prompts/security-screening.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      - name: Remove the repository's agent instructions
        run: >-
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md
          -o -name .claude -o -name .mcp.json -o -name .claude.json \) -print0 | xargs -0 rm -rf
      # The scrubbed environment needs bubblewrap. The action installs it only
      # for workflows that let in users without write access, so this step does
      # what the action's own does.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 and later restrict unprivileged user namespaces.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # v1.0.262
      - id: screen
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          ACTIONS_STEP_DEBUG: "false"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: false
          display_report: false
          claude_args: |
            --model claude-haiku-5-5
            --effort low
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,WebFetch,WebSearch,Read(//proc/**),Read(./.git/**),Read(/${{ runner.temp }}/**)"
            --json-schema '{"type":"object","properties":{"touches_security":{"type":"boolean"}},"required":["touches_security"]}'

  # Posts with the workflow token, as `github-actions[bot]`. The job holds no
  # `id-token`, so nothing in it can sign in as an app.
  security-review:
    name: Claude security review
    needs: security-screening
    if: ${{ !cancelled() && needs.security-screening.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DEPTH: ${{ needs.security-screening.outputs.touches_security == 'true' && 'Deep' || 'Standard' }}
      # The repository variable SECURITY_REVIEW_MODEL picks the model, in Settings → Secrets and variables → Actions.
      MODEL: ${{ vars.SECURITY_REVIEW_MODEL || 'claude-opus-5-5' }}
      EFFORT: ${{ needs.security-screening.outputs.touches_security == 'true' && 'xhigh' || 'medium' }}
    steps:
      # The merge commit, so branches from before the prompt files still have them.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DIFF: /tmp/pr-review/pr.diff
        run: |
          mkdir -p "$(dirname "$DIFF")"
          gh pr diff "$PR_NUMBER" -R "$REPO" > "$DIFF"
          {
            echo 'text<<END_OF_PROMPT'
            envsubst '$REPO $PR_NUMBER $HEAD_SHA $DIFF $DEPTH $MODEL $EFFORT' < .github/prompts/security-review.md
            echo 'END_OF_PROMPT'
          } >> "$GITHUB_OUTPUT"
      - name: Remove the repository's agent instructions
        run: >-
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name AGENTS.md
          -o -name .claude -o -name .mcp.json -o -name .claude.json \) -print0 | xargs -0 rm -rf
      # The scrubbed environment needs bubblewrap. The action installs it only
      # for workflows that let in users without write access, so this step does
      # what the action's own does.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          # Ubuntu 24.04 and later restrict unprivileged user namespaces.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # v1.0.262
      - id: review
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          ACTIONS_STEP_DEBUG: "false"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          show_full_output: false
          display_report: false
          claude_args: |
            --model ${{ env.MODEL }}
            --effort ${{ env.EFFORT }}
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,WebFetch,WebSearch,Read(//proc/**),Read(./.git/**),Read(/${{ runner.temp }}/**)"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"]}'
      # Refuses a summary that holds either token, as is or in base64.
      - name: Post the summary
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT: ${{ steps.review.outputs.structured_output }}
          SUMMARY: /tmp/pr-review/summary.md
        run: |
          jq -r .summary <<< "$OUTPUT" > "$SUMMARY"
          for secret in "$GH_TOKEN" "$CLAUDE_TOKEN"; do
            for form in "$secret" "$(printf %s "$secret" | base64 -w0)"; do
              if grep -qF -- "$form" "$SUMMARY"; then
                echo "::error::The summary holds a secret. It was not posted."
                exit 1
              fi
            done
          done
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$SUMMARY"
      # Hides the earlier summaries that found nothing, now that a newer one is
      # posted. Summaries with findings stay visible.
      - name: Hide earlier summaries without findings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  comments(last: 100) { nodes { id isMinimized author { login } body } }
                }
              }
            }' --jq '
            [.data.repository.pullRequest.comments.nodes[]
             | select(.author.login == "github-actions" and (.body | contains("## Claude Code Security Review")))]
            | .[:-1][] | select(.isMinimized | not)
            | select(.body | contains("✓ No security issues found")) | .id' |
          while read -r id; do
            gh api graphql --silent -f id="$id" -f query='
              mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { clientMutationId } }'
          done
