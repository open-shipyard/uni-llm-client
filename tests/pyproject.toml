[project]
name = "uni-llm-client-contract-tests"
version = "0"
description = "Language-agnostic tests that every uni-llm-client port must pass"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2",
    "pytest>=9",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["."]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "slow: tests that take seconds because they wait in real time",
]
xfail_strict = true
